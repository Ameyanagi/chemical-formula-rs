name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo pkgid | sed -E 's|.*@([^ ]+)$|\1|')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag v${tag_version} does not match crate version ${crate_version}."
            exit 1
          fi

      - name: Test release artifact
        run: cargo test --workspace --locked --all-features

      - name: Package check
        run: cargo package --locked

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --locked --dry-run

      - name: Ensure CRATES_IO_TOKEN is configured
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not configured."
            exit 1
          fi

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked
