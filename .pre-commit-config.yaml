repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|src/.*\.rs)$

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|src/.*\.(rs|pest))$

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|src/.*\.(rs|pest))$
